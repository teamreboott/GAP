# SynthTabNet dataset specific configurations
#-------------------------------#
image_path: ./data/synthtabnet            # <- set to your dataset path
meta_data_path: ./data/synthtabnet/meta_data  # <- set to your dataset path

input_size:
  height: 768
  width: 768
window_size: 8
align_along_axis: False

max_length: 1376
bbox_token_cnt: 864
use_cell_bbox: True  # Use ground truth bbox from SynthTabNet